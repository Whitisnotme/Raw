port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  listen: 0.0.0.0:53
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

# 代理节点配置
proxies:
  - name: "AWS-SG"
    type: snell
    server: 47.128.149.112
    port: 8080
    psk: ZNnTHnLfxaBlsUZv
    version: 5
    udp: true
    #reuse: true

# 策略组配置
proxy-groups:
  - name: "PROXIES"
    type: select
    proxies:
      - "AWS-SG"
      - "DIRECT"

# 基础路由规则
rules:
  - GEOIP,CN,DIRECT
  - MATCH,PROXIES
